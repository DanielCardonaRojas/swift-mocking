# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Every job here only checks out and builds; none write back to the repo or its
# API. Without this block the token would default to write access.
permissions:
  contents: read

jobs:
  build:
    # Matrix entries are named for the Swift version the selected Xcode actually
    # ships, verified from the "Print Swift version" step below. The previous
    # '5.9'/'6.0' labels were wrong — Xcode 16.0 ships Swift 6.0 and Xcode 16.4
    # ships Swift 6.1, so neither job ever ran the version it claimed. Nothing can
    # run below 6.0 regardless: Package.swift declares swift-tools-version 6.0, so
    # an older toolchain cannot load the manifest at all.
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift-version: '6.0'
            xcode-version: 'Xcode_16.0.app'
          - swift-version: '6.1'
            xcode-version: 'Xcode_16.4.app'
          # Covers the newest swift-syntax the range admits, which is what resolution
          # actually picks. Without this job every CI run would build an older
          # swift-syntax than real consumers get.
          - swift-version: '6.2'
            xcode-version: 'Xcode_26.2.app'

    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: List available Xcode versions
      run: ls /Applications/ | grep Xcode
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/${{ matrix.xcode-version }}
    - name: Print Swift version
      run: swift --version
    - name: Print xcodebuild version
      run: xcodebuild -version
    - name: Skip macro validation
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
    # Package.resolved is gitignored, so each job resolves fresh and may pick a
    # different swift-syntax than the others. Log it: when a job fails, the first
    # thing worth knowing is which swift-syntax it actually built against.
    - name: Print resolved swift-syntax version
      run: |
        swift package resolve
        grep -A6 '"identity" : "swift-syntax"' Package.resolved | grep '"version"'
    - name: Run main project tests
      run: |
        xcrun xcodebuild \
          -scheme "swift-mocking-Package" \
          -destination 'platform=macOS' \
          -derivedDataPath .derivedData \
          -enableCodeCoverage NO \
          clean test
    - name: Run race-condition guards under Thread Sanitizer
      run: swift test --sanitize=thread --filter race_condition
    - name: Run Examples project tests
      run: |
        cd Examples/
        xcrun xcodebuild \
          -scheme "Examples" \
          -destination 'platform=macOS' \
          -derivedDataPath .derivedData \
          -enableCodeCoverage NO \
          clean test

  # The build matrix above only exercises whichever swift-syntax resolution happens to
  # pick — the newest in range — so the rest of the supported range goes untested, and
  # the version under test changes on its own whenever swift-syntax ships a release.
  #
  # The pins deliberately span both API families that
  # MockableGenerator/SwiftSyntax+Extensions.swift branches on: 509 and 510 compile the
  # pre-600 `#else` arms, 601/603/604 the `canImport(SwiftSyntax600)` arms. Dropping the
  # pre-600 pins would leave that half of the shims uncompiled anywhere in CI.
  #
  # The majors come from the pin files themselves rather than a hardcoded list, so
  # adding one stays a single-file change: drop in
  # Examples/CompatibilityPins/swift-syntax-<major>.resolved and it gets its own job.
  swift-syntax-pins:
    runs-on: macos-15
    outputs:
      majors: ${{ steps.discover.outputs.majors }}
    steps:
    - uses: actions/checkout@v4
    - id: discover
      run: |
        majors=$(ls Examples/CompatibilityPins/*.resolved \
          | sed 's#.*/swift-syntax-##; s#\.resolved$##' \
          | sort -V \
          | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "majors=$majors" >> "$GITHUB_OUTPUT"
        echo "Discovered majors: $majors"

  swift-syntax-compatibility:
    needs: swift-syntax-pins
    # One job per pinned major: they are independent, so running them in parallel keeps
    # wall-clock flat as majors are added, and a failure names the version in the job
    # title instead of being buried in a serial log.
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.swift-syntax-pins.outputs.majors) }}
    name: swift-syntax ${{ matrix.major }}
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.2.app
    - name: Skip macro validation
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
    - name: Test Examples against swift-syntax ${{ matrix.major }}
      run: Scripts/test-swift-syntax-compat.sh ${{ matrix.major }}
